<style>
/* Layout: single phone column; two stages; sealed answers (private until both are in); one section per screen */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --yes: #7cc79c; --yes-soft: #1c3127; --maybe: #e2bd6a; --maybe-soft: #3a2f17; --no: #ec8c8c; --no-soft: #3b1f22; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #16121a; --surface: #201a26; --ink: #eee8f2; --muted: #a79cb0; --line: #352d3d; --accent: #e08aab; --accent-soft: #3a2230;
  --yes: #7cc79c; --yes-soft: #1c3127; --maybe: #e2bd6a; --maybe-soft: #3a2f17; --no: #ec8c8c; --no-soft: #3b1f22; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 620px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; text-wrap: balance; margin: 0; }
h1 { font-size: 2.3rem; line-height: 1.05; } h2 { font-size: 1.8rem; line-height: 1.1; } h3 { font-size: 1.3rem; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
p { margin: 0; } .muted { color: var(--muted); } .small { font-size: .9rem; }
.stack { display: flex; flex-direction: column; gap: 16px; } .stack-lg { display: flex; flex-direction: column; gap: 28px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }

button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn:disabled { opacity: .45; cursor: default; }

.who button strong { display: block; font-family: var(--display); font-size: 1.7rem; font-weight: 400; } .who button span { font-size: .85rem; color: var(--muted); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; margin-bottom: 8px; }

@media (prefers-reduced-motion: reduce) { .fill { transition: none } }
.q { display: flex; flex-direction: column; gap: 8px; } .q label, .q .qtext { font-weight: 500; }
.qnum { color: var(--accent); font-weight: 700; margin-right: 4px; font-variant-numeric: tabular-nums; }

textarea.long { min-height: 240px; }

.scale button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 10px 0; border-radius: 8px; font-variant-numeric: tabular-nums; font-weight: 600; }
.scale button[aria-pressed="true"] { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.scale-ends { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
.ymn { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ymn-row { display: flex; flex-direction: column; gap: 8px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 9px 0; border-radius: 8px; font-weight: 600; font-size: .9rem; }
.seg button[data-v="yes"][aria-pressed="true"] { background: var(--yes-soft); border-color: var(--yes); color: var(--yes); }
.seg button[data-v="maybe"][aria-pressed="true"] { background: var(--maybe-soft); border-color: var(--maybe); color: var(--maybe); }
.seg button[data-v="no"][aria-pressed="true"] { background: var(--no-soft); border-color: var(--no); color: var(--no); }
.note { background: var(--accent-soft); border-radius: 12px; padding: 14px 16px; font-size: .95rem; }

.letter p { font-family: var(--display); font-size: 1.25rem; line-height: 1.35; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.locked { opacity: .6; }
.status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pill { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.pill b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.2rem; } .pill .st { font-size: .85rem; } .st.done { color: var(--yes); font-weight: 600; }
.saved { font-size: .8rem; color: var(--muted); }
.cmp-q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.ans { display: flex; flex-direction: column; gap: 2px; } .ans .nm { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); }
.ans .tx { white-space: pre-wrap; overflow-wrap: anywhere; } .ans .tx.empty { color: var(--muted); font-style: italic; }
.flag { font-size: .85rem; color: var(--no); font-weight: 600; } .err { color: var(--no); font-weight: 600; font-size: .95rem; }
.verdict { display: inline-block; font-size: .75rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; }
.v-yes { background: var(--yes-soft); color: var(--yes); } .v-talk { background: var(--maybe-soft); color: var(--maybe); } .v-no { background: var(--no-soft); color: var(--no); }
.pair { display: flex; gap: 16px; font-size: .9rem; flex-wrap: wrap; }
.confirm { border: 1px solid var(--no); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.decide { display: grid; gap: 8px; }
.decide button { background: var(--surface); border: 1px solid var(--line); color: var(--ink); padding: 12px; border-radius: 10px; text-align: left; font-weight: 500; }
.decide button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
</style>

<div class="wrap" id="app"><p class="muted">Loading…</p></div>

<script>
const PEOPLE = { matt: "Matt", louise: "Louise" };
const STAGES = {
  1: { title: "Deciding", blurb: "Whether this is something you both genuinely want.", sections: [
    { id: "why", title: "Why, or why not", qs: [
      ["why1", "In your own words: why do you want this? Or why don't you?"],
      ["why2", "How much do you want this?", "scale"],
      ["why3", "If your partner had never brought this up, would you have wanted it on your own?"],
      ["why4", "Is any part of you agreeing because you're worried about what happens to us if you say no?"],
      ["why5", "If your partner's honest answer is no, what happens to us? Answer this whether you're the one asking or the one being asked."],
      ["why6", "What would you want in return, or what's something you'd want to try that's your idea?"] ]},
    { id: "feel", title: "Feelings and fears", qs: [
      ["f1", "What's the worst realistic way this could go for you?"],
      ["f2", "What would be hardest for you to see or hear, either with her or during the weeks of looking for her?"],
      ["f3", "What does your jealousy look like when it shows up, and what helps most when you feel insecure?"],
      ["f4", "Is there anyone in our lives (friends, coworkers, exes) you would not want this to be?"],
      ["f5", "What would make you want to call it off partway through, and how would you tell me?"] ]},
    { id: "ymn", title: "Yes / Maybe / No", type: "ymn",
      intro: "A No from either of you takes it off the table. A Maybe means only after you've talked it through.",
      qs: [
      ["a1", "Flirting and kissing while all three are together"],
      ["a2", "Matt kissing her"], ["a3", "Louise kissing her"],
      ["a4", "Matt being physical with her (touching, oral)"], ["a5", "Louise being physical with her (touching, oral)"],
      ["a6", "Matt having intercourse with her"], ["a7", "Louise using toys with her"],
      ["a8", "Louise being the main focus"], ["a9", "Matt being the main focus"], ["a10", "Her being the main focus"],
      ["a11", "One of us only watching for part of it"],
      ["a12", "Matt having time alone with her"], ["a13", "Louise having time alone with her"],
      ["a14", "Alcohol involved"], ["a15", "Photos or video of any kind"] ],
      extra: ["aOther", "Anything else, with your Yes / Maybe / No"] } ]},
  2: { title: "Planning", blurb: "Only once you're both a genuine yes.", sections: [
    { id: "rules", title: "Rules and limits", qs: [
      ["r1", "Where should it happen (our place, hers, a hotel), and can she stay the night?"],
      ["r2", "Once only, or could she become a repeat partner? A stranger, or is someone we know okay?"],
      ["r3", "Who has the final say on who she is?"],
      ["r4", "Can either of us message her one-on-one, before or after? What does the other get to see?"],
      ["r5", "Does anything change about how we act as a couple in front of her (affection, pet names, our bed)?"],
      ["r6", "Who, if anyone, are we allowed to tell?"],
      ["r7", "What, if it happened, would mean we never do this again?"] ]},
    { id: "safe", title: "Safer sex and health", qs: [
      ["s1", "Condoms with her: always, for everything, or only for some things?"],
      ["s2", "Recent STI tests for all three before anything happens? How recent, and who asks her?"],
      ["s3", "Birth control: is our current method enough, or do we want a backup?"] ]},
    { id: "find", title: "Finding her", qs: [
      ["n1", "Who takes the lead in finding and messaging her, and how does the other stay in the loop?"],
      ["n2", "Where are you comfortable looking: apps, social events, mutual friends?"],
      ["n3", "What matters to you in her, what's a dealbreaker, and does she need to be into both of us?"],
      ["n4", "How many meetups before anything physical, and what do we tell her upfront about our rules?"],
      ["n5", "What if one of us likes her and the other doesn't?"],
      ["n6", "During the weeks of looking, what do you need from me? (check-ins, seeing the messages, a pause rule)"] ]},
    { id: "picture", title: "Picture it",
      intro: "Describe it the way you'd want it, or the most you'd be comfortable with.",
      qs: [
      ["p1", "Who should take the lead, and how? (Matt, Louise, her, or it shifts as things go)"],
      ["p2", "What do you most want to experience or feel, and what would help you feel relaxed and safe?"],
      ["p3", "Write a scenario of how you'd like it to go, from meeting her to the end of the night: where you are, how it starts, what happens, and how it ends.", "long"] ]},
    { id: "moment", title: "In the moment",
      intro: "Agree now: either of you can stop at any time, for any reason, and the other doesn't argue or sulk about it later.",
      qs: [
      ["m1", "What word or signal means \"pause and check in with me\"? And what means \"we're stopping, no questions\"?"],
      ["m2", "If one of us stops it, what does the other do right then, and what do we say to her?"],
      ["m3", "How do you want to be checked on during it, and what would reassure you while it's happening?"] ]},
    { id: "after", title: "After", qs: [
      ["t1", "Right after she leaves, what do you want: closeness, space, talking, sleep?"],
      ["t2", "What would you need to hear from your partner afterward to feel secure?"],
      ["t3", "If one of us had a great time and the other didn't, how do we handle that? And how will we decide whether to do it again?"] ]} ]},
};

const S = { db: null, uid: null, me: null, view: "loading", stage: 1, step: 0, answers: {}, cmpIdx: 0,
  status: {}, revealed: {}, decision: {}, saveTimer: null, savedMsg: "", confirm: null, err: "", noWrite: false, shown: {} };
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const other = () => S.me === "matt" ? "louise" : "matt";
function lsGet(k) { try { return localStorage.getItem(k) } catch { return null } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} }
const key = (stage, p) => `s${stage}-${p}`;
const privRef = (stage, p) => S.db && S.uid ? S.db.doc(`data/users/${S.uid}/${key(stage, p)}`) : null;
const statusRef = (stage, p) => S.db.doc(`status/${key(stage, p)}`);
const revealedRef = (stage, p) => S.db.doc(`revealed/${key(stage, p)}`);
const decisionRef = p => S.db.doc(`decision/${p}`);
function explain(e) {
  const c = e && e.code;
  if (c === "invalid_argument" || c === "not_granted") { S.noWrite = true; return `You don't have permission to save on this page. Ask Matt to share it with you as an Editor, then reload.`; }
  if (!S.db) return "Saving isn't available in this view. Open the page signed in to Claude.";
  return "Couldn't save. Check your connection and try again.";
}

async function init() {
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  S.db = db; S.uid = user ? await user.id() : null;
  if (db) {
    const rerender = () => { if (["home", "compare"].includes(S.view)) render(); };
    for (const st of [1, 2]) for (const p of Object.keys(PEOPLE)) {
      statusRef(st, p).onSnapshot(s => { S.status[key(st, p)] = s.exists ? s.data() : null; rerender(); maybeReveal(); }, () => {});
      revealedRef(st, p).onSnapshot(s => { S.revealed[key(st, p)] = s.exists ? s.data() : null; rerender(); }, () => {});
    }
    for (const p of Object.keys(PEOPLE)) decisionRef(p).onSnapshot(s => { S.decision[p] = s.exists ? s.data() : null; rerender(); }, () => {});
  }
  const saved = lsGet("bwisi-me");
  if (saved && PEOPLE[saved]) await pick(saved); else { S.view = "who"; render(); }
}

async function loadDraft(stage) {
  S.answers = {}; S.step = 0;
  const ref = privRef(stage, S.me);
  try {
    if (ref) { const d = await ref.get(); if (d.exists) { const b = d.data(); S.answers = { ...(b.answers || {}) }; S.step = b.step || 0; } }
    else { const loc = JSON.parse(lsGet(`bwisi-${key(stage, S.me)}`) || "null"); if (loc) { S.answers = loc.answers || {}; S.step = loc.step || 0; } }
  } catch {}
  S.step = Math.min(S.step, STAGES[stage].sections.length - 1);
}
async function pick(p) { S.me = p; lsSet("bwisi-me", p); S.view = "home"; render(); }

function queueSave() { clearTimeout(S.saveTimer); S.savedMsg = "Saving…"; updateSaved(); S.saveTimer = setTimeout(saveDraft, 700); }
async function saveDraft() {
  const body = { answers: S.answers, step: S.step, updated: new Date().toISOString() };
  const ref = privRef(S.stage, S.me);
  try { if (ref) await ref.set(body); else lsSet(`bwisi-${key(S.stage, S.me)}`, JSON.stringify(body)); S.savedMsg = "Saved privately"; }
  catch (e) { S.savedMsg = explain(e); }
  updateSaved();
}
function updateSaved() { const el = document.getElementById("saved"); if (el) el.textContent = S.savedMsg; }

const ready = (st, p) => !!S.status[key(st, p)];
const bothReady = st => ready(st, "matt") && ready(st, "louise");
const bothRevealed = st => !!(S.revealed[key(st, "matt")] && S.revealed[key(st, "louise")]);
const bothYes = () => S.decision.matt?.value === "yes" && S.decision.louise?.value === "yes";

// Sealed reveal: once both are ready, each phone copies its own private answers to the shared space.
let revealing = false;
async function maybeReveal() {
  if (revealing || !S.db || !S.uid) return;
  revealing = true;
  try {
    for (const st of [1, 2]) {
      if (!bothReady(st)) continue;
      for (const p of Object.keys(PEOPLE)) {
        if (S.revealed[key(st, p)]) continue;
        const ref = privRef(st, p); if (!ref) continue;
        const d = await ref.get(); if (!d.exists) continue;
        await revealedRef(st, p).set({ answers: d.data().answers || {}, at: new Date().toISOString() });
      }
    }
  } catch {} finally { revealing = false; }
}

function countAnswered(stage) {
  let n = 0, total = 0;
  for (const s of STAGES[stage].sections) for (const [id] of s.qs) { total++; if (S.answers[id] !== undefined && S.answers[id] !== "") n++; }
  return { n, total };
}

function render() {
  ({ loading: () => {}, who: renderWho, home: renderHome, form: renderForm, review: renderReview, compare: renderCompare })[S.view]();
}

function renderWho() {
  app.innerHTML = `<div class="stack-lg">
    <div class="stack"><span class="eyebrow">A questionnaire for couples</span><h1>Before We Invite Someone In</h1>
      <p class="muted">Each of you answers on your own phone. Answers stay sealed until you've both submitted, then you read them together.</p></div>
    <div class="stack"><p class="qtext"><b>Who's filling this out?</b></p>
      <div class="who"><button id="pick-matt"><strong>Matt</strong><span>Start or continue</span></button>
        <button id="pick-louise"><strong>Louise</strong><span>Start or continue</span></button></div></div>
    ${!S.db ? `<p class="note">Shared saving isn't available in this view. Open the page signed in to Claude.</p>` : ""}
  </div>`;
  document.getElementById("pick-matt").onclick = () => pick("matt");
  document.getElementById("pick-louise").onclick = () => pick("louise");
}

function stageCard(st) {
  const me = S.me, them = other();
  const mine = ready(st, me), theirs = ready(st, them), rev = bothRevealed(st);
  const stat = p => ready(st, p) ? `<span class="st done">Submitted</span>` : `<span class="st muted">Not yet</span>`;
  let body, locked = false;
  if (st === 2 && !bothRevealed(1)) { locked = true; body = `<p class="muted small">Opens after you've both read Stage 1 and both said you're a genuine yes.</p>`; }
  else if (st === 2 && !bothYes()) { locked = true;
    const d = p => S.decision[p]?.value;
    const line = (!d("matt") || !d("louise")) ? "Opens once you've both answered the question at the end of Stage 1." :
      (d("matt") === "no" || d("louise") === "no") ? "One of you said no. Stage 2 stays closed, and that's a complete answer." :
      "One of you isn't sure yet. Take the time you need.";
    body = `<p class="muted small">${line}</p>`; }
  else if (rev) body = `<button class="btn" data-compare="${st}">Read Stage ${st} together</button>`;
  else if (bothReady(st)) body = `<p class="small">You've both submitted. Open this page on both phones to unseal the answers.</p>`;
  else if (mine) body = `<p class="small">Your answers are sealed. They'll open when ${PEOPLE[them]} submits too.</p><div><button class="btn ghost" data-withdraw="${st}">Withdraw and edit</button></div>`;
  else body = `<div><button class="btn" data-start="${st}">${S.stage === st && Object.keys(S.answers).length ? "Continue" : "Start"} Stage ${st}</button></div>`;
  return `<div class="card ${locked ? "locked" : ""}"><div class="stack-sm"><span class="eyebrow">Stage ${st}</span><h3>${STAGES[st].title}</h3><p class="muted small">${STAGES[st].blurb}</p></div>
    ${locked ? "" : `<div class="status"><div class="pill"><b>Matt</b>${stat("matt")}</div><div class="pill"><b>Louise</b>${stat("louise")}</div></div>`}
    ${body}</div>`;
}

function renderHome() {
  app.innerHTML = `<div class="stack-lg">
    <div class="stack"><span class="eyebrow">Hi, ${PEOPLE[S.me]}</span><h1>Before We Invite Someone In</h1></div>
    <div class="letter"><span class="eyebrow">Before you begin</span>
      <p>Usually one partner brings an idea like this up, and it may be something they want very much. If you're the other partner, it's normal to feel nervous, uncomfortable or unsure. Say so here.</p>
      <p>Sharing a desire like this takes trust, and that trust runs both ways. Each of you can bring your wants, desires, boundaries, non-negotiables and "no"s to the other without judgement or resentment. The same goes for your feelings and the reasons behind them. Whatever they are, they won't be judged, and explaining them is how you come to understand each other better.</p>
      <p>Answer honestly, not with what you think your partner wants to hear. Take your time and dig deep. If an answer might make your partner uncomfortable, write it anyway. That includes if your honest answer is that you don't want this.</p>
      <p>The goal is to know each other fully, whatever you decide, and for both of you to feel safe being completely yourselves.</p></div>
    <div class="stack-sm"><p class="qtext"><b>How it works</b></p>
      <p class="small">Two stages. Stage 1 is about whether you both want this. You each answer alone, then read both sets of answers together and each say where you stand. Stage 2, the planning, only opens if you both say yes. Answers are sealed until both of you have submitted.</p>
      <p class="muted small">"Not sure" and "no" are complete answers. A polite answer you don't mean is the only wrong one.</p></div>
    ${stageCard(1)}${stageCard(2)}
    ${S.err ? `<p class="err">${esc(S.err)}</p>` : ""}
    ${S.confirm ? `<div class="confirm"><p>${esc(S.confirm.text)}</p><div class="row"><button class="btn danger" id="c-yes">${esc(S.confirm.label)}</button><button class="btn ghost" id="c-no">Cancel</button></div></div>` : ""}
    <div><button class="btn ghost" id="switch">I'm not ${PEOPLE[S.me]}</button></div>
  </div>`;
  app.querySelectorAll("[data-start]").forEach(b => b.onclick = async () => { S.stage = +b.dataset.start; await loadDraft(S.stage); S.view = "form"; render(); scrollTo(0, 0); });
  app.querySelectorAll("[data-compare]").forEach(b => b.onclick = () => { S.stage = +b.dataset.compare; S.cmpIdx = 0; S.shown = {}; S.view = "compare"; render(); scrollTo(0, 0); });
  app.querySelectorAll("[data-withdraw]").forEach(b => b.onclick = () => {
    S.confirm = { text: "Withdraw your answers so you can keep editing? Nothing is lost; you'll submit again when you're done.", label: "Withdraw",
      run: async () => { await statusRef(+b.dataset.withdraw, S.me).delete(); } }; render(); });
  const c = id => document.getElementById(id);
  if (c("c-yes")) c("c-yes").onclick = async () => { const r = S.confirm.run; S.confirm = null; S.err = ""; try { await r(); } catch (e) { S.err = explain(e); } render(); };
  if (c("c-no")) c("c-no").onclick = () => { S.confirm = null; render(); };
  c("switch").onclick = () => { lsSet("bwisi-me", null); S.me = null; S.answers = {}; S.view = "who"; render(); };
  maybeReveal();
}

function qHTML(id, text, kind, num) {
  const v = S.answers[id];
  if (kind === "scale") {
    const btns = Array.from({ length: 10 }, (_, i) => `<button type="button" data-scale="${id}" data-n="${i + 1}" aria-pressed="${v === i + 1}">${i + 1}</button>`).join("");
    return `<div class="q"><span class="qtext"><span class="qnum">${num}.</span>${esc(text)}</span><div class="scale" role="group" aria-label="${esc(text)}">${btns}</div>
      <div class="scale-ends"><span>Not at all</span><span>Very much</span></div></div>`;
  }
  return `<div class="q"><label for="q-${id}"><span class="qnum">${num}.</span>${esc(text)}</label><textarea id="q-${id}" data-q="${id}"${kind === "long" ? ' class="long"' : ""}>${esc(v || "")}</textarea></div>`;
}

function renderForm() {
  const secs = STAGES[S.stage].sections, sec = secs[S.step];
  const pct = Math.round(((S.step + 1) / secs.length) * 100), last = S.step === secs.length - 1;
  let body;
  if (sec.type === "ymn") {
    body = `<div class="ymn">${sec.qs.map(([id, t]) => `<div class="ymn-row"><span>${esc(t)}</span><div class="seg" role="group" aria-label="${esc(t)}">
      ${["yes", "maybe", "no"].map(o => `<button type="button" data-ymn="${id}" data-v="${o}" aria-pressed="${S.answers[id] === o}">${o[0].toUpperCase() + o.slice(1)}</button>`).join("")}</div></div>`).join("")}</div>
      ${qHTML(sec.extra[0], sec.extra[1], "text", "+")}`;
  } else body = sec.qs.map(([id, t, k], i) => qHTML(id, t, k || "text", i + 1)).join("");
  app.innerHTML = `<div class="bar"><div class="bar-row"><span>${PEOPLE[S.me]} · Stage ${S.stage} · ${S.step + 1} of ${secs.length}</span><span id="saved" class="saved">${esc(S.savedMsg)}</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div></div>
    <div class="stack-lg"><div class="stack"><h2>${esc(sec.title)}</h2>${sec.intro ? `<p class="muted">${esc(sec.intro)}</p>` : ""}</div>${body}
      <div class="row"><button class="btn ghost" id="back">${S.step === 0 ? "Home" : "Back"}</button><button class="btn" id="next">${last ? "Review and submit" : "Next"}</button></div>
      ${S.step === 0 ? `<div><button class="btn ghost" id="clear">Clear my Stage ${S.stage} answers</button></div>` : ""}
      ${S.confirm ? `<div class="confirm"><p>${esc(S.confirm.text)}</p><div class="row"><button class="btn danger" id="c-yes">${esc(S.confirm.label)}</button><button class="btn ghost" id="c-no">Cancel</button></div></div>` : ""}
    </div>`;
  app.querySelectorAll("textarea[data-q]").forEach(t => t.addEventListener("input", () => { S.answers[t.dataset.q] = t.value; queueSave(); }));
  const press = (b, attr) => { S.answers[b.dataset[attr]] = attr === "scale" ? +b.dataset.n : b.dataset.v; queueSave(); b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  app.querySelectorAll("[data-scale]").forEach(b => b.onclick = () => press(b, "scale"));
  app.querySelectorAll("[data-ymn]").forEach(b => b.onclick = () => press(b, "ymn"));
  const c = id => document.getElementById(id);
  c("back").onclick = () => { if (S.step === 0) S.view = "home"; else { S.step--; queueSave(); } render(); scrollTo(0, 0); };
  c("next").onclick = () => { if (last) S.view = "review"; else { S.step++; queueSave(); } render(); scrollTo(0, 0); };
  if (c("clear")) c("clear").onclick = () => { S.confirm = { text: `Clear every Stage ${S.stage} answer you've written? This only affects your own answers.`, label: "Clear mine",
    run: async () => { S.answers = {}; S.step = 0; const ref = privRef(S.stage, S.me); if (ref) await ref.delete(); else lsSet(`bwisi-${key(S.stage, S.me)}`, null); } }; render(); };
  if (c("c-yes")) c("c-yes").onclick = async () => { const r = S.confirm.run; S.confirm = null; try { await r(); } catch (e) { S.savedMsg = explain(e); } render(); };
  if (c("c-no")) c("c-no").onclick = () => { S.confirm = null; render(); };
}

function renderReview() {
  const { n, total } = countAnswered(S.stage), blanks = total - n;
  app.innerHTML = `<div class="stack-lg"><div class="stack"><span class="eyebrow">${PEOPLE[S.me]} · Stage ${S.stage}</span><h2>Ready to submit?</h2>
    <p>You answered ${n} of ${total} questions.${blanks ? ` ${blanks} are blank, which is fine if that's your answer.` : ""}</p>
    <p class="muted">Your answers stay sealed until ${PEOPLE[other()]} submits too. Until then you can withdraw and keep editing.</p></div>
    <p id="err" class="err" hidden></p>
    <div class="row"><button class="btn ghost" id="back">Keep editing</button><button class="btn" id="submit">Submit my answers</button></div></div>`;
  document.getElementById("back").onclick = () => { S.view = "form"; render(); };
  document.getElementById("submit").onclick = async e => {
    e.target.disabled = true;
    try {
      clearTimeout(S.saveTimer); await saveDraft();
      if (!S.db) throw { code: "offline" };
      if (!privRef(S.stage, S.me)) throw { code: "not_granted" };
      await statusRef(S.stage, S.me).set({ ready: true, at: new Date().toISOString() });
      S.view = "home"; render(); scrollTo(0, 0);
    } catch (err) { const el = document.getElementById("err"); el.hidden = false; el.textContent = explain(err); e.target.disabled = false; }
  };
}

function ansHTML(p, v) {
  const empty = v === undefined || v === "";
  return `<div class="ans"><span class="nm">${PEOPLE[p]}</span><span class="tx ${empty ? "empty" : ""}">${empty ? "No answer" : esc(v)}</span></div>`;
}
const cap = x => x ? x[0].toUpperCase() + x.slice(1) : "No answer";

function renderCompare() {
  const st = S.stage;
  if (!bothRevealed(st)) { S.view = "home"; return render(); }
  const A = { matt: S.revealed[key(st, "matt")].answers || {}, louise: S.revealed[key(st, "louise")].answers || {} };
  const secs = STAGES[st].sections, n = secs.length, isDecide = st === 1 && S.cmpIdx === n;
  const order = S.me === "louise" ? ["louise", "matt"] : ["matt", "louise"];
  let inner, title;
  if (isDecide) {
    title = "Where are you?";
    const mine = S.decision[S.me]?.value, theirs = S.decision[other()]?.value;
    const at = S.revealed[key(1, "matt")].at; const d = at ? new Date(at) : null;
    inner = `<p>Having read all of it, answer for yourself, on your own phone. Don't discuss it first.</p>
      ${d ? `<p class="muted small">Answers were unsealed ${d.toLocaleDateString(undefined, { month: "long", day: "numeric" })}. Sleep on it before you answer this.</p>` : ""}
      <div class="decide">
        <button data-decide="yes" aria-pressed="${mine === "yes"}">I'm a genuine yes. I want to plan this.</button>
        <button data-decide="unsure" aria-pressed="${mine === "unsure"}">I'm not sure yet. I need more time or more talking.</button>
        <button data-decide="no" aria-pressed="${mine === "no"}">I'm a no, and I'm trusting that's okay.</button></div>
      <p class="small">${PEOPLE[other()]}: ${theirs ? `<b>${cap(theirs)}</b>` : "hasn't answered yet"}. ${bothYes() ? "You're both a yes. Stage 2 is open on the home screen." : ""}</p>`;
  } else {
    const sec = secs[S.cmpIdx]; title = sec.title;
    if (sec.type === "ymn") {
      inner = sec.qs.map(([id, t]) => { const l = A.louise[id], m = A.matt[id];
        const v = (l === "no" || m === "no") ? ["v-no", "Off the table"] : (l === "yes" && m === "yes") ? ["v-yes", "Agreed"] : ["v-talk", "Talk it through"];
        return `<div class="cmp-q"><span>${esc(t)}</span><div class="pair"><span><b>Louise:</b> ${cap(l)}</span><span><b>Matt:</b> ${cap(m)}</span></div><span class="verdict ${v[0]}">${v[1]}</span></div>`; }).join("")
        + `<div class="cmp-q"><span>${esc(sec.extra[1])}</span>${order.map(p => ansHTML(p, A[p][sec.extra[0]])).join("")}</div>`;
    } else if (sec.id === "picture") {
      inner = `<p class="note">These are the most personal answers here. Read each one aloud to the other, one at a time, before opening the next.</p>` +
        sec.qs.map(([id, t], i) => `<div class="cmp-q"><span class="qtext"><span class="qnum">${i + 1}.</span>${esc(t)}</span>
          ${order.map(p => S.shown[id + p] ? ansHTML(p, A[p][id]) : `<div><button class="btn ghost" data-show="${id}${p}">Show ${PEOPLE[p]}'s answer</button></div>`).join("")}</div>`).join("");
    } else {
      inner = sec.qs.map(([id, t, k], i) => {
        let flag = "";
        if (k === "scale") { const l = A.louise[id], m = A.matt[id];
          if (l === undefined || m === undefined) flag = `<span class="flag">One of you didn't answer this. Ask why.</span>`;
          else if (Math.abs(l - m) >= 3) flag = `<span class="flag">Scores are ${Math.abs(l - m)} apart. Talk about this before anything else.</span>`; }
        if (id === "why4") flag = `<span class="muted small">Anything other than a clear no here is worth stopping on.</span>`;
        if (id === "why5") flag = `<span class="muted small">If these two answers don't match, this is the conversation to have before any other.</span>`;
        return `<div class="cmp-q"><span class="qtext"><span class="qnum">${i + 1}.</span>${esc(t)}</span>${order.map(p => ansHTML(p, A[p][id])).join("")}${flag}</div>`; }).join("");
    }
  }
  const total = st === 1 ? n + 1 : n;
  app.innerHTML = `<div class="bar"><div class="bar-row"><span>Reading Stage ${st} together · ${S.cmpIdx + 1} of ${total}</span></div><div class="track"><div class="fill" style="width:${Math.round(((S.cmpIdx + 1) / total) * 100)}%"></div></div></div>
    <div class="stack-lg">
    ${S.cmpIdx === 0 ? `<p class="note"><b>Before you read:</b> one section per sitting is fine. Take turns reading your own answer aloud first. Read with curiosity, not defense; when an answer stings, ask about it before reacting, and thank each other for the hard ones.${st === 1 ? " Keep the lines you both said Yes to, talk through the Maybes, and drop every No without debate." : ""}</p>` : ""}
    <h2>${esc(title)}</h2>${inner}
    <div class="row"><button class="btn ghost" id="prev">${S.cmpIdx === 0 ? "Home" : "Back"}</button>${S.cmpIdx < total - 1 ? `<button class="btn" id="nextc">Next section</button>` : `<button class="btn" id="done">Home</button>`}</div>
    ${S.cmpIdx === total - 1 ? `<div class="stack-sm"><h3>Start Stage ${st} over</h3><p class="muted small">Clears both submissions${st === 1 ? " and both decisions" : ""}. Each of you keeps your own draft to edit.</p>
      ${S.confirm ? `<div class="confirm"><p>${esc(S.confirm.text)}</p><div class="row"><button class="btn danger" id="c-yes">${esc(S.confirm.label)}</button><button class="btn ghost" id="c-no">Cancel</button></div></div>` : `<div><button class="btn ghost" id="reset">Clear Stage ${st} for both</button></div>`}
      ${S.err ? `<p class="err">${esc(S.err)}</p>` : ""}</div>` : ""}
    </div>`;
  const c = id => document.getElementById(id);
  c("prev").onclick = () => { if (S.cmpIdx === 0) S.view = "home"; else S.cmpIdx--; render(); scrollTo(0, 0); };
  if (c("nextc")) c("nextc").onclick = () => { S.cmpIdx++; render(); scrollTo(0, 0); };
  if (c("done")) c("done").onclick = () => { S.view = "home"; render(); scrollTo(0, 0); };
  app.querySelectorAll("[data-show]").forEach(b => b.onclick = () => { S.shown[b.dataset.show] = true; render(); });
  app.querySelectorAll("[data-decide]").forEach(b => b.onclick = async () => {
    S.err = ""; try { await decisionRef(S.me).set({ value: b.dataset.decide, at: new Date().toISOString() }); } catch (e) { S.err = explain(e); } render(); });
  if (c("reset")) c("reset").onclick = () => { S.confirm = { text: `Clear Stage ${st} for both of you? This can't be undone.`, label: "Clear both", run: async () => {
    for (const p of Object.keys(PEOPLE)) { await statusRef(st, p).delete(); await revealedRef(st, p).delete(); if (st === 1) { await decisionRef(p).delete(); await statusRef(2, p).delete(); await revealedRef(2, p).delete(); } }
    S.view = "home"; } }; render(); };
  if (c("c-yes")) c("c-yes").onclick = async () => { const r = S.confirm.run; S.confirm = null; S.err = ""; try { await r(); } catch (e) { S.err = explain(e); } render(); scrollTo(0, 0); };
  if (c("c-no")) c("c-no").onclick = () => { S.confirm = null; render(); };
}

init();
</script>
